name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/firebase-hosting-merge.yml"

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production API URL
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Set the Actions repository variable VITE_API_BASE_URL to the public FastAPI service URL before deploying Firebase Hosting."
            exit 1
          fi
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::VITE_API_BASE_URL must use HTTPS for a hosted deployment."; exit 1 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EV_EASE }}
          channelId: live
          projectId: ev-ease
          entryPoint: ./client
