<!DOCTYPE html>
<html>
<head>

<title>Add Station</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
background:#020617;
color:white;
padding:50px;
font-family:sans-serif;
}

.container{
max-width:700px;
}

input,
select{
margin-bottom:20px;
}

.btn-success{
background:#22c55e;
border:none;
}

.back-btn{
display:inline-block;
margin-bottom:20px;
background:#1e293b;
padding:10px 20px;
border-radius:10px;
text-decoration:none;
color:white;
}

</style>

</head>

<body>

<div class="container">

<a href="/admin-dashboard"
class="back-btn">

← Back

</a>

<h1 class="mb-4">
➕ Add Charging Station
</h1>

<form method="POST"
action="/save-station">

<input
type="text"
name="station_name"
placeholder="Station Name"
class="form-control"
required>

<input
type="text"
name="city"
placeholder="City"
class="form-control"
required>

<select
name="charger_type"
class="form-control">

<option>
AC Level 1 Charging
</option>

<option>
AC Level 2 Charging
</option>

<option>
DC Fast Charging
</option>

</select>

<input
type="text"
name="location"
placeholder="Location"
class="form-control"
required>

<input
type="number"
name="available_slots"
placeholder="Available Slots"
class="form-control"
required>

<button
class="btn btn-success w-100">

Add Station

</button>

</form>

</div>

</body>
</html>
