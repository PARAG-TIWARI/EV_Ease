<!DOCTYPE html>
<html>
<head>

<title>Manage Users</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
background:#020617;
color:white;
padding:40px;
font-family:sans-serif;
}

table{
background:#111827;
border-radius:20px;
overflow:hidden;
}

h1{
margin-bottom:30px;
color:#22c55e;
}

.btn-back{
background:#22c55e;
color:white;
padding:10px 20px;
border-radius:10px;
text-decoration:none;
margin-bottom:20px;
display:inline-block;
}

</style>

</head>

<body>

<a href="/admin-dashboard"
class="btn-back">

← Back

</a>

<h1>
👥 Registered Users
</h1>

<table class="table table-dark">

<tr>
<th>ID</th>
<th>Username</th>
</tr>

{% for user in users %}

<tr>
<td>{{ user.login_id }}</td>
<td>{{ user.username }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
