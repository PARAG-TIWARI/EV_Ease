<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Book Slot | EVEase</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:
    linear-gradient(rgba(5,10,30,.96),
    rgba(5,10,30,.96));
    min-height:100vh;
    color:white;
}

.navbar{
    background:#111827;
    padding:18px 60px;
}

.logo{
    font-size:34px;
    font-weight:800;
    color:#22c55e;
    text-decoration:none;
}

.booking-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:90vh;
    padding:40px;
}

.booking-card{
    width:100%;
    max-width:750px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:30px;
    padding:45px;
}

.booking-title{
    text-align:center;
    font-size:42px;
    font-weight:800;
    margin-bottom:30px;
}

.booking-title span{
    color:#22c55e;
}

.station-info{
    background:#101827;
    padding:25px;
    border-radius:18px;
    margin-bottom:30px;
}

.station-info p{
    margin-bottom:12px;
    color:#cbd5e1;
}

.form-control{
    height:58px;
    border-radius:14px;
    background:#17243b;
    border:none;
    color:white;
    margin-bottom:20px;
}

.form-control:focus{
    background:#17243b;
    color:white;
    box-shadow:none;
    border:1px solid #22c55e;
}

.btn-book{
    width:100%;
    height:60px;
    border:none;
    border-radius:16px;
    background:#22c55e;
    color:white;
    font-size:20px;
    font-weight:700;
    transition:.3s;
}

.btn-book:hover{
    transform:translateY(-3px);
}

</style>
</head>

<body>

<nav class="navbar">

<a href="{{ url_for('home') }}"
   class="logo">
   ⚡ EVEase
</a>

</nav>

<div class="booking-container">

<div class="booking-card">

<h1 class="booking-title">

Book <span>Charging Slot</span>

</h1>

<div class="station-info">

<p>
⚡ <strong>Station:</strong>
{{ station.station_name }}
</p>

<p>
🏙 <strong>City:</strong>
{{ station.city }}
</p>

<p>
📍 <strong>Location:</strong>
{{ station.location }}
</p>

<p>
🔌 <strong>Charger:</strong>
{{ station.charger_type }}
</p>

</div>

<form action="{{ url_for('save_booking') }}"
      method="POST">

<input type="hidden"
       name="station_name"
       value="{{ station.station_name }}">

<input type="hidden"
       name="city"
       value="{{ station.city }}">

<input type="hidden"
       name="charger_type"
       value="{{ station.charger_type }}">

<label>
Select Date
</label>

<input type="date"
       name="booking_date"
       class="form-control"
       required>

<label>
Select Time
</label>

<input type="time"
       name="booking_time"
       class="form-control"
       required>

{% if wallet_balance > 0 %}
<div style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 15px; border-radius: 14px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
    <div>
        <h4 style="margin: 0; color: #22c55e; font-size: 16px;">🎁 EVE Coins Available</h4>
        <p style="margin: 0; color: #cbd5e1; font-size: 14px;">You have {{ wallet_balance }} coins (Max discount: 50 INR)</p>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <label for="use_coins" style="margin: 0; font-weight: bold;">Apply Discount</label>
        <input type="checkbox" id="use_coins" name="use_coins" style="width: 20px; height: 20px; accent-color: #22c55e;">
    </div>
</div>
{% endif %}

<button type="submit"
        class="btn-book">

Confirm Booking

</button>

</form>

</div>

</div>

</body>
</html>
